<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>School Club Members | ICT Quarter 2</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 32px;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1a1a1a;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-of-type {
            margin-bottom: 0;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            color: #1a1a1a;
            background-color: #fafafa;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #1a1a1a;
            background-color: #ffffff;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        input[type="button"] {
            flex: 1 1 auto;
            padding: 9px 14px;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #333333;
        }

        #output1 {
            margin-top: 20px;
            padding: 16px;
            min-height: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 15px;
            color: #1a1a1a;
            white-space: pre-line;
        }

        form {
            margin: 0;
        }

        .site-nav {
            width: min(100%, 900px);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
        }

        .site-nav a {
            padding: 8px 10px;
            border-radius: 5px;
            color: #1a1a1a;
            font-size: 14px;
            text-decoration: none;
        }

        .site-nav a:hover,
        .site-nav a[aria-current="page"] {
            background: #1a1a1a;
            color: #fff;
        }
    </style>
</head>
<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="../ICT%20seatwork%201/index.html">Home</a>
        <a href="../Skills%20Test/index.html">Weather Instruments</a>
        <a href="index.html" aria-current="page">School Club Members</a>
        <a href="../meet-the-creator.html">Meet the Creator</a>
    </nav>

    <main class="card">
        <header>
            <h1>Dance Club</h1>
        </header>
        <h2>School Club Members</h2>
        <p>Add a name to the combined school-club member list.</p>
        <label for="first_name">First name</label>
        <input type="text" id="first_name" placeholder="First Name" autocomplete="given-name">
        <label for="last_name">Last name</label>
        <input type="text" id="last_name" placeholder="Last Name" autocomplete="family-name">
        <input type="button" py-click="add_member" value="Add Member">
        <h2>Total Members: <span id="member_count">0</span></h2>
        <div id="output1" aria-live="polite"></div>
    </main>
    <script type="py" src="main.py"></script>
</body>
</html>
