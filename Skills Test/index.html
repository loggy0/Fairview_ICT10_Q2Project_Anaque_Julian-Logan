<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Weather Instruments Finder | ICT Quarter 2</title>
    <style>
        .card-banner {
            display: block;
            width: 100%;
            max-height: 120px;
            height: auto;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 32px;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1a1a1a;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-of-type {
            margin-bottom: 0;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            color: #1a1a1a;
            background-color: #fafafa;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #1a1a1a;
            background-color: #ffffff;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        input[type="button"] {
            flex: 1 1 auto;
            padding: 9px 14px;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #333333;
        }

        #user_input + input[type="button"] {
            width: 100%;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        #user_input + input[type="button"]:hover {
            background-color: #f0f0f0;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            min-height: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 15px;
            color: #1a1a1a;
        }

        form {
            margin: 0;
        }

        .site-nav {
            width: min(100%, 900px);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
        }

        .site-nav a {
            padding: 8px 10px;
            border-radius: 5px;
            color: #1a1a1a;
            font-size: 14px;
            text-decoration: none;
        }

        .site-nav a:hover,
        .site-nav a[aria-current="page"] {
            background: #1a1a1a;
            color: #fff;
        }

        .card {
            max-width: 560px;
        }

        #result {
            white-space: pre-line;
        }

        #output1 {
            margin-top: 20px;
            padding: 16px;
            min-height: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 15px;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="../../../../Desktop/Academics/ICT%202nd%20Qtr/ICT%20seatwork%201/index.html">Home</a>
        <a href="index.html" aria-current="page">Weather Instruments</a>
        <a href="../Drill%202/index.html">School Club Members</a>
        <a href="../meet-the-creator.html">Meet the Creator</a>
    </nav>

    <main class="card">
        <img src="O.B. Montessori Aerospace Engineering.png" alt="O.B. Montessori Aerospace Engineering logo" class="card-banner">
        <header>
            <h1>Weather Instruments Finder</h1>
        </header>
        <h2>Enter weather instrument name</h2>
        <label for="instrument_name">Instrument Name</label>
        <input type="text" id="instrument_name" placeholder="Instrument Name">
        <p style="font-size: 10px; color: #808080;">Try Thermometer, Barometer, Anemometer, Hygrometer, Rain Gauge, Wind Vane, Weather Balloon, or Pyranometer.</p>
        <div id="output1" aria-live="polite"></div>
        <input type="button" py-click="search_instrument" value="Search Instrument">
    </main>
    <script type="py" src="main.py"></script>
</body>
</html>
